name = "hippodrome-solver"
main = "src/index.js"
compatibility_date = "2023-05-18"

# D1 Databases bindings
[[d1_databases]]
binding = "DB_TOP_ROW"
database_name = "hippodrome-top-row"
database_id = "YOUR_DB_ID_HERE"

[[d1_databases]]
binding = "DB_FIRST_COLUMN"
database_name = "hippodrome-first-column"
database_id = "YOUR_DB_ID_HERE"

[[d1_databases]]
binding = "DB_LAST_COLUMN"
database_name = "hippodrome-last-column"
database_id = "YOUR_DB_ID_HERE"

[[d1_databases]]
binding = "DB_CORNERS"
database_name = "hippodrome-corners"
database_id = "YOUR_DB_ID_HERE"

[[d1_databases]]
binding = "DB_CENTER"
database_name = "hippodrome-center"
database_id = "YOUR_DB_ID_HERE"

[[d1_databases]]
binding = "DB_TARGETS"
database_name = "hippodrome-targets"
database_id = "YOUR_DB_ID_HERE"

# Static assets
[site]
bucket = "./static"
